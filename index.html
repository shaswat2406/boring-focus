    // --- Web Audio Tactile Tick & Harmonic Chime ---
    let audioCtx = null;
    function getAudioContext() {
      if (!audioCtx) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioCtx();
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function playTactileTick() {
      try {
        const ctx = getAudioContext();
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(320, now);
        osc.frequency.exponentialRampToValueAtTime(70, now + 0.025);
        gain.gain.setValueAtTime(0.04, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.025);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.03);
      } catch (e) {}
    }

    function playChimeSound() {
      try {
        const ctx = getAudioContext();
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(528, now);
        gain.gain.setValueAtTime(0.28, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 2.4);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 2.5);
      } catch (e) {}
    }

    // --- IndexedDB Local Storage ---
    const DB_NAME = 'BoringFocus_LocalHub_DB_v4';
    function openLocalDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains('files')) {
            db.createObjectStore('files', { keyPath: 'id' });
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function dbSaveFile(fileRecord) {
      const db = await openLocalDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction('files', 'readwrite');
        tx.objectStore('files').put(fileRecord);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    async function dbGetAllFiles() {
      const db = await openLocalDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction('files', 'readonly');
        const req = tx.objectStore('files').getAll();
        req.onsuccess = () => resolve(req.result || []);
        req.onerror = () => reject(req.error);
      });
    }

    async function dbDeleteFile(id) {
      const db = await openLocalDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction('files', 'readwrite');
        tx.objectStore('files').delete(id);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    // ==========================================
    // VIBRANT COLOR-MERGING FLUID VIDEO SPLASH SCREEN
    // ==========================================
    function FluidCanvasBackground() {
      const canvasRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let animId;
        let w = (canvas.width = window.innerWidth);
        let h = (canvas.height = window.innerHeight);

        const onResize = () => {
          if (!canvas) return;
          w = canvas.width = window.innerWidth;
          h = canvas.height = window.innerHeight;
        };
        window.addEventListener('resize', onResize);

        // Fluid merging color orbs (metaballs simulation)
        const orbs = [
          { x: w * 0.25, y: h * 0.35, vx: 1.5, vy: 1.1, r: 220, color: [236, 72, 153] }, // Neon Pink
          { x: w * 0.75, y: h * 0.35, vx: -1.3, vy: 1.4, r: 250, color: [56, 189, 248] }, // Vivid Cyan
          { x: w * 0.50, y: h * 0.75, vx: 0.9, vy: -1.5, r: 270, color: [139, 92, 246] }, // Violet
          { x: w * 0.30, y: h * 0.65, vx: -1.1, vy: -1.0, r: 190, color: [245, 158, 11] }, // Amber
          { x: w * 0.70, y: h * 0.25, vx: 1.4, vy: -1.2, r: 230, color: [16, 185, 129] }, // Emerald
        ];

        let time = 0;
        const render = () => {
          time += 0.02;
          ctx.fillStyle = '#040508';
          ctx.fillRect(0, 0, w, h);

          ctx.globalCompositeOperation = 'screen';

          orbs.forEach((orb, i) => {
            orb.x += orb.vx + Math.sin(time + i * 1.5) * 1.2;
            orb.y += orb.vy + Math.cos(time + i * 1.2) * 1.2;

            if (orb.x - orb.r < 0 || orb.x + orb.r > w) orb.vx *= -1;
            if (orb.y - orb.r < 0 || orb.y + orb.r > h) orb.vy *= -1;

            const grad = ctx.createRadialGradient(orb.x, orb.y, 0, orb.x, orb.y, orb.r);
            const [r, g, b] = orb.color;
            grad.addColorStop(0, `rgba(${r}, ${g}, ${b}, 0.85)`);
            grad.addColorStop(0.5, `rgba(${r}, ${g}, ${b}, 0.35)`);
            grad.addColorStop(1, `rgba(${r}, ${g}, ${b}, 0)`);

            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(orb.x, orb.y, orb.r, 0, Math.PI * 2);
            ctx.fill();
          });

          ctx.globalCompositeOperation = 'source-over';
          ctx.fillStyle = 'rgba(4, 5, 8, 0.45)';
          ctx.fillRect(0, 0, w, h);

          animId = requestAnimationFrame(render);
        };

        render();

        return () => {
          window.removeEventListener('resize', onResize);
          cancelAnimationFrame(animId);
        };
      }, []);

      return <canvas ref={canvasRef} className="absolute inset-0 w-full h-full filter blur-[35px] pointer-events-none" />;
    }

    function AndroidSplashScreen({ onFinish }) {
      const [progress, setProgress] = useState(0);

      useEffect(() => {
        const interval = setInterval(() => {

            if (prev >= 100) {

    function FullScreenPortraitReelsWithActions({ voidSwipeCount, onIncrementSwipe, onSelectTab, onOpenApkModal }) {
      const [reels, setReels] = useState(() => Array.from({ length: 50 }, (_, i) => ({ id: i + 1 })));

      const [hapticEnabled, setHapticEnabled] = useState(true);
      
      // Interactive Social States

      const [floatingHearts, setFloatingHearts] = useState([]);
      const lastTapRef = useRef(0);

      const [commentDrawerOpen, setCommentDrawerOpen] = useState(false);
      const [comments, setComments] = useState(() => {
        try {
          const c = localStorage.getItem('bf_void_comments_v1');
          return c ? JSON.parse(c) : [
            { id: 1, user: 'Mindful Fidgeter', text: 'Day 3 using the candy-cigarette void. My urge to doom-scroll Instagram is practically gone.', time: '2h ago' },
            { id: 2, user: 'Python Student', text: 'Swiping nothingness while waiting for code to compile. Actually calming.', time: '5h ago' },
            { id: 3, user: 'Stoic Focus', text: 'Zero algorithm. Zero ads. Just thumb movement until my brain realizes there is no dopamine.', time: '1d ago' }
          ];
        } catch { return []; }
      });
      const [newCommentText, setNewCommentText] = useState('');
      const [toast, setToast] = useState(null);
      const containerRef = useRef(null);

      useEffect(() => {
        const t = setInterval(() => setSessionSeconds(s => s + 1), 1000);
        return () => clearInterval(t);
      }, []);

      const showToast = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(null), 2800);
      };

      const handleScroll = (e) => {
        const el = e.target;
        const currentIdx = Math.round(el.scrollTop / el.clientHeight);
        if (currentIdx !== activeReelIndex) {
          setActiveReelIndex(currentIdx);
          onIncrementSwipe();
          if (hapticEnabled) playTactileTick();

          if (currentIdx >= reels.length - 8) {
            setReels(prev => [
              ...prev,
              ...Array.from({ length: 25 }, (_, i) => ({ id: prev.length + i + 1 }))
            ]);
          }
        }
      };

      // Toggle Like
      const handleToggleLike = (idx = activeReelIndex) => {
        playTactileTick();
        const currentLiked = likedCards[idx];
        setLikedCards(prev => ({ ...prev, [idx]: !currentLiked }));
        setLikesCount(prev => ({
          ...prev,
          [idx]: (prev[idx] || 42) + (currentLiked ? -1 : 1)
        }));
        showToast(currentLiked ? 'Unliked' : '❤️ Like registered. Zero algorithm. You are in control.');
      };

      // Double-Tap Anywhere To Like (Instagram / TikTok Style)
      const handleDoubleTapCard = (e, reelIdx) => {
        const now = Date.now();
        if (now - lastTapRef.current < 320) {
          // Double-tap trigger
          const rect = e.currentTarget.getBoundingClientRect();
          const clientX = e.clientX || (rect.left + rect.width / 2);
          const clientY = e.clientY || (rect.top + rect.height / 2);

          if (!likedCards[reelIdx]) {
            handleToggleLike(reelIdx);
          }

          const heartId = Date.now() + Math.random();
          setFloatingHearts(prev => [...prev, { id: heartId, x: clientX, y: clientY }]);
          setTimeout(() => {
            setFloatingHearts(prev => prev.filter(h => h.id !== heartId));
          }, 850);

          playTactileTick();
        }
        lastTapRef.current = now;
      };

      // Share
      const handleShare = () => {
        playTactileTick();
        if (navigator.share) {
          navigator.share({
            title: 'Boring Focus Void Reel',
            text: 'I am breaking my doom-scrolling habit with Boring Focus Void Reels.',
            url: window.location.href,
          }).catch(() => {});
        } else {
          navigator.clipboard?.writeText('https://boringfocus.app - Dopamine Habit Extinguisher');
          showToast('📋 Copied mindful link to clipboard!');
        }
      };

      // Post Comment
      const handlePostComment = (e) => {
        e.preventDefault();
        if (!newCommentText.trim()) return;
        const newC = {
          id: Date.now(),
          user: 'You (Mindful Reflector)',
          text: newCommentText.trim(),
          time: 'Just now',
        };
        const updated = [newC, ...comments];
        setComments(updated);
        try { localStorage.setItem('bf_void_comments_v1', JSON.stringify(updated)); } catch {}
        setNewCommentText('');
        showToast('Reflection saved to your local journal!');
      };

      const formatTime = (sec) => {
        const m = Math.floor(sec / 60);
        const s = sec % 60;
        return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
      };

      const currentCardLikes = likesCount[activeReelIndex] || (42 + activeReelIndex);
      const isCardLiked = !!likedCards[activeReelIndex];

      return (
        <div className="fixed inset-0 z-40 w-full h-[100dvh] bg-black overflow-hidden flex flex-col select-none">
          {/* Floating Heart Popups on Double Tap */}
          {floatingHearts.map(h => (

              key={h.id}
              className="fixed pointer-events-none z-50 animate-heart-pop"
              style={{ left: h.x, top: h.y, transform: 'translate(-50%, -50%)' }}
            >
              <svg className="w-24 h-24 text-red-500 fill-red-500 drop-shadow-[0_0_25px_rgba(239,68,68,0.8)]" viewBox="0 0 24 24">
                <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
              </svg>
            </div>
          ))}

          {/* Toast Notification */}
          {toast && (
            <div className="absolute top-16 left-6 right-6 z-50 p-2.5 rounded-xl bg-zinc-900 border border-white/20 text-xs text-white text-center shadow-2xl backdrop-blur-xl">
              {toast}
            </div>
          )}

          {/* Top Translucent Floating HUD */}
          <div className="absolute top-0 left-0 right-0 z-30 pt-safe-top p-4 flex items-center justify-between pointer-events-none">
            <div className="pointer-events-auto flex items-center gap-2 bg-black/60 backdrop-blur-xl px-3 py-1.5 rounded-full border border-white/15 text-xs shadow-lg">
              <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse" />
              <span className="font-mono text-white font-bold text-[11px]">
                Void #{activeReelIndex + 1}
              </span>
              <span className="text-slate-600 font-mono">|</span>
              <span className="font-mono text-slate-300 text-[11px]">
                {formatTime(sessionSeconds)}
              </span>
            </div>

            <div className="pointer-events-auto flex items-center gap-2">
              <button
                onClick={onOpenApkModal}
                className="px-2.5 py-1 rounded-full bg-emerald-500/20 border border-emerald-500/40 text-[10px] font-mono text-emerald-300 font-bold backdrop-blur-xl"
              >
                APK
              </button>

                {/* Central Sensory Void (Candy Cigarette Fidget) */}
                <div className="flex flex-col items-center justify-center my-auto">

                    {String(idx + 1).padStart(2, '0')}
                  </span>
                  <span className="text-[11px] font-mono text-[#1f2430] tracking-widest uppercase mt-4">
                    Pure Void • Zero Dopamine Loop
                  </span>
                  <span className="text-[10px] text-[#191d27] font-mono mt-1">
                    (Double-tap anywhere to like)
                  </span>

                {/* Reel Bottom Meta (Instagram / TikTok Style) */}

                  <div className="flex items-center gap-1.5 pointer-events-auto">
                    <span className="text-xs font-bold text-white tracking-tight">@boringfocus.void</span>
                    <span className="w-3.5 h-3.5 rounded-full bg-sky-400 text-zinc-950 flex items-center justify-center text-[8px] font-bold">✓</span>
                  </div>
                  <p className="text-xs text-slate-300 font-sans leading-snug">
                    Candy-cigarette tactile fidget. Swipe up to satisfy thumb motion without releasing dopamine.
                  </p>
                  <div className="flex items-center gap-2 text-[10px] font-mono text-slate-400 pt-0.5">
                    <span className="flex items-center gap-1">
                      <IconDisc className="w-3 h-3 text-sky-400" />
                      Original Audio - Pure Silence
                    </span>
                  </div>
                </div>
              </div>
            ))}
          </div>

          {/* Right-Hand Vertical Action Rail: LIKE, COMMENT, SHARE, AUDIO */}
          <div className="absolute right-3.5 bottom-24 z-30 flex flex-col items-center gap-4">
            {/* Like Option */}
            <button
              onClick={() => handleToggleLike(activeReelIndex)}
              className="flex flex-col items-center gap-1 group active:scale-90 transition-transform"
              title="Like"
            >
              <div className="w-12 h-12 rounded-full bg-black/60 backdrop-blur-xl border border-white/20 flex items-center justify-center text-white group-hover:scale-110 shadow-2xl">
                <IconHeart className="w-6 h-6" filled={isCardLiked} />
              </div>
              <span className="text-[10px] font-mono font-medium text-white/90">
                {currentCardLikes}
              </span>
            </button>

            {/* Comment Option */}
            <button
              onClick={() => { playTactileTick(); setCommentDrawerOpen(true); }}
              className="flex flex-col items-center gap-1 group active:scale-90 transition-transform"
              title="Reflective Comments"
            >
              <div className="w-12 h-12 rounded-full bg-black/60 backdrop-blur-xl border border-white/20 flex items-center justify-center text-white group-hover:scale-110 shadow-2xl">
                <IconMessageCircle className="w-6 h-6" />
              </div>
              <span className="text-[10px] font-mono font-medium text-white/90">
                {comments.length}

            {/* Share Option */}
            <button

              className="flex flex-col items-center gap-1 group active:scale-90 transition-transform"

              <div className="w-12 h-12 rounded-full bg-black/60 backdrop-blur-xl border border-white/20 flex items-center justify-center text-white group-hover:scale-110 shadow-2xl">
                <IconShare2 className="w-6 h-6" />
              </div>
              <span className="text-[10px] font-mono font-medium text-white/90">
                Share
              </span>
            </button>

            {/* Spinning Audio Record */}
            <div className="flex flex-col items-center gap-1 mt-1">
              <div className="w-10 h-10 rounded-full bg-black/80 border-2 border-white/40 flex items-center justify-center text-slate-300 spin-slow shadow-xl">
                <IconDisc className="w-5 h-5 text-sky-400" />
              </div>
              <span className="text-[8px] font-mono text-slate-500">Audio</span>
            </div>
          </div>

          {/* Floating Transparent Bottom Navigation Dock (In-Reel Overlay) */}
          <div className="absolute bottom-3 left-0 right-0 z-30 px-4 pointer-events-none">
            <div className="max-w-xs mx-auto pointer-events-auto bg-black/80 backdrop-blur-2xl border border-white/15 rounded-2xl p-1.5 shadow-2xl grid grid-cols-3 gap-1">
              <button
                onClick={() => onSelectTab('hub')}
                className="py-2 px-1 text-slate-300 hover:text-white rounded-xl text-xs font-medium flex flex-col items-center gap-0.5"
              >
                <IconFolderHub className="w-4 h-4 text-sky-400" />
                <span className="text-[10px]">Local Hub</span>
              </button>
              <button
                onClick={() => onSelectTab('focus')}
                className="py-2 px-1 text-slate-300 hover:text-white rounded-xl text-xs font-medium flex flex-col items-center gap-0.5"
              >
                <IconClock className="w-4 h-4 text-amber-400" />
                <span className="text-[10px]">Focus</span>
              </button>
              <button
                onClick={() => onSelectTab('tasks')}
                className="py-2 px-1 text-slate-300 hover:text-white rounded-xl text-xs font-medium flex flex-col items-center gap-0.5"
              >
                <IconCheckSquare className="w-4 h-4 text-emerald-400" />
                <span className="text-[10px]">Tasks</span>
              </button>
            </div>
          </div>

          {/* In-Reel Comments & Reflection Drawer (Instagram Style) */}
          {commentDrawerOpen && (
            <div className="fixed inset-0 z-50 bg-black/75 backdrop-blur-sm flex flex-col justify-end">
              <div className="w-full max-w-md mx-auto bg-zinc-950 border-t border-white/15 rounded-t-3xl p-4 flex flex-col max-h-[75vh] shadow-2xl">
                {/* Drawer Header */}
                <div className="flex items-center justify-between border-b border-white/10 pb-3 mb-3">
                  <div>
                    <h3 className="text-sm font-bold text-white">Mindful Reflections ({comments.length})</h3>
                    <p className="text-[10px] font-mono text-slate-400">Candy-cigarette habit exchange thoughts</p>
                  </div>
                  <button
                    onClick={() => setCommentDrawerOpen(false)}
                    className="px-3 py-1 text-xs rounded-full bg-white/10 text-slate-300 hover:text-white"
                  >
                    Close
                  </button>
                </div>

                {/* Comments List */}
                <div className="flex-1 overflow-y-auto space-y-3 pr-1 py-1">
                  {comments.map(c => (
                    <div key={c.id} className="p-3 rounded-xl bg-white/5 border border-white/5 space-y-1">
                      <div className="flex items-center justify-between text-xs">
                        <span className="font-semibold text-sky-400">{c.user}</span>
                        <span className="text-[10px] font-mono text-slate-500">{c.time}</span>
                      </div>
                      <p className="text-xs text-slate-200 leading-relaxed font-sans">{c.text}</p>
                    </div>

                {/* Add Comment / Reflection Form */}
                <form onSubmit={handlePostComment} className="pt-3 border-t border-white/10 flex items-center gap-2">
                  <input
                    type="text"
                    value={newCommentText}
                    onChange={(e) => setNewCommentText(e.target.value)}
                    placeholder="Log a thought or urge to reflect on..."
                    className="flex-1 bg-white/5 border border-white/10 rounded-xl px-3 py-2 text-xs text-white placeholder-slate-500 focus:outline-none"
                  />
                  <button
                    type="submit"
                    disabled={!newCommentText.trim()}
                    className="p-2 rounded-xl bg-sky-400 text-zinc-950 hover:bg-sky-300 disabled:opacity-40"

      );

    // ==========================================
    // MODULE: LOCAL FILE HUB (PDF/PPT IN-APP & DEVICE VIEWER)
    // ==========================================
    function LocalFileHub({ theme, sections, setSections, files, setFiles }) {
      const [activeSectionId, setActiveSectionId] = useState(sections[0]?.id || '');
      const [searchQuery, setSearchQuery] = useState('');
      const [typeFilter, setTypeFilter] = useState('all');
      const [previewItem, setPreviewItem] = useState(null);
      const [addPathModalOpen, setAddPathModalOpen] = useState(false);
      const [pathInput, setPathInput] = useState('');
      const [pathNameInput, setPathNameInput] = useState('');
      const [toast, setToast] = useState(null);
      const fileInputRef = useRef(null);

      const showToast = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(null), 2800);
      };

      const activeSection = sections.find(s => s.id === activeSectionId) || sections[0];

      const handleAddSection = () => {
        const name = prompt('Enter new topic section name (e.g., Python, C++, Research):');
        if (!name || !name.trim()) return;
        const colors = ['#38bdf8', '#8b5cf6', '#10b981', '#f59e0b', '#f43f5e'];
        const icons = ['📁', '🐍', '⚡', '📊', '📚', '🎯'];
        const newSec = {
          id: 'sec-' + Date.now(),
          name: name.trim(),
          color: colors[Math.floor(Math.random() * colors.length)],
          icon: icons[Math.floor(Math.random() * icons.length)],
        };
        setSections([...sections, newSec]);
        setActiveSectionId(newSec.id);
      };

      const handleFileSelected = (e) => {
        const selectedFiles = Array.from(e.target.files || []);
        if (selectedFiles.length === 0) return;

        selectedFiles.forEach(file => {
          const isPdf = file.name.endsWith('.pdf') || file.type === 'application/pdf';
          const isPpt = file.name.endsWith('.ppt') || file.name.endsWith('.pptx');
          const isImg = file.type.startsWith('image/');
          const isCode = file.name.endsWith('.py') || file.name.endsWith('.js') || file.name.endsWith('.ts') || file.name.endsWith('.txt') || file.name.endsWith('.md');
          const fileType = isPdf ? 'pdf' : isPpt ? 'ppt' : isImg ? 'image' : isCode ? 'code' : 'doc';

          const reader = new FileReader();
          if (isCode) {
            reader.onload = (ev) => {
              saveFileRecord({
                id: 'file-' + Date.now() + Math.random().toString(36).slice(2, 6),
                sectionId: activeSectionId,
                name: file.name,
                type: 'code',
                sizeStr: (file.size / 1024).toFixed(1) + ' KB',
                content: ev.target.result,
                dateAdded: Date.now(),
              });
            };
            reader.readAsText(file);
          } else {
            reader.onload = (ev) => {
              saveFileRecord({
                id: 'file-' + Date.now() + Math.random().toString(36).slice(2, 6),
                sectionId: activeSectionId,
                name: file.name,
                type: fileType,
                sizeStr: (file.size / (1024 * 1024)).toFixed(2) + ' MB',
                dataUrl: ev.target.result,
                dateAdded: Date.now(),
              });
            };
            reader.readAsDataURL(file);
          }
        });
        if (fileInputRef.current) fileInputRef.current.value = '';
      };

      const saveFileRecord = async (item) => {
        await dbSaveFile(item);
        setFiles(prev => [item, ...prev]);
        showToast(`Added ${item.name} to ${activeSection?.name}`);
      };

      const handleAddPath = () => {
        if (!pathInput.trim()) return;
        const name = pathNameInput.trim() || pathInput.split('\\').pop().split('/').pop() || 'Resource';
        const isPdf = pathInput.toLowerCase().endsWith('.pdf');
        const isPpt = pathInput.toLowerCase().endsWith('.ppt') || pathInput.toLowerCase().endsWith('.pptx');
        const isImg = pathInput.toLowerCase().endsWith('.png') || pathInput.toLowerCase().endsWith('.jpg');

        const item = {
          id: 'path-' + Date.now(),
          sectionId: activeSectionId,
          name,
          type: isPdf ? 'pdf' : isPpt ? 'ppt' : isImg ? 'image' : 'path',
          localPath: pathInput.trim(),
          sizeStr: 'Local Path',
          dateAdded: Date.now(),
        };

        saveFileRecord(item);
        setPathInput('');
        setPathNameInput('');
        setAddPathModalOpen(false);
      };

      const handleDelete = async (id, e) => {
        if (e) e.stopPropagation();
        if (!window.confirm('Delete resource from section?')) return;
        await dbDeleteFile(id);
        setFiles(prev => prev.filter(f => f.id !== id));
        if (previewItem?.id === id) setPreviewItem(null);
      };

      const handleOpenInDeviceDefault = (item) => {
        if (item.dataUrl) {
          const win = window.open();
          win.document.write(`<iframe src="${item.dataUrl}" frameborder="0" style="border:0; top:0; left:0; bottom:0; right:0; width:100%; height:100%;" allowfullscreen></iframe>`);
        } else if (item.localPath) {
          const formatted = 'file:///' + item.localPath.replace(/\\/g, '/');
          window.open(formatted, '_blank');
          navigator.clipboard?.writeText(item.localPath);
          showToast(`Opening ${item.name} & copied path!`);
        }
      };

      const filtered = files
        .filter(f => f.sectionId === activeSectionId)
        .filter(f => typeFilter === 'all' ? true : f.type === typeFilter)
        .filter(f => !searchQuery.trim() || f.name.toLowerCase().includes(searchQuery.toLowerCase()));

      return (
        <div className="flex-1 flex flex-col h-[calc(100vh-9.5rem)] max-w-5xl mx-auto w-full">
          {toast && (
            <div className="absolute top-2 right-4 z-50 p-2.5 rounded-xl bg-zinc-900 border border-white/20 text-xs text-white shadow-xl backdrop-blur-xl">
              {toast}
            </div>
          )}

          <input
            type="file"
            ref={fileInputRef}
            onChange={handleFileSelected}
            multiple
            className="hidden"
            accept=".pdf,.ppt,.pptx,.png,.jpg,.jpeg,.py,.txt,.md"
          />

          {/* Section Tabs */}
          <div className="flex items-center justify-between border-b border-white/10 pb-2 mb-3 gap-2 overflow-x-auto no-scrollbar">
            <div className="flex items-center gap-1.5 overflow-x-auto no-scrollbar py-0.5">
              {sections.map(sec => {
                const isSelected = sec.id === activeSectionId;
                const count = files.filter(f => f.sectionId === sec.id).length;
                return (
                  <button
                    key={sec.id}
                    onClick={() => setActiveSectionId(sec.id)}
                    style={{ borderColor: isSelected ? sec.color : 'transparent' }}
                    className={`flex items-center gap-1.5 px-3.5 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap transition-all border ${
                      isSelected
                        ? 'bg-white/15 text-white shadow-md'
                        : 'bg-white/5 text-slate-400 hover:text-white hover:bg-white/10'
                    }`}
                  >
                    <span>{sec.icon}</span>
                    <span>{sec.name}</span>
                    <span className="text-[10px] font-mono px-1.5 py-0.2 rounded-full bg-white/10 text-slate-300">
                      {count}
                    </span>
                  </button>
                );
              })}
              <button
                onClick={handleAddSection}
                className="px-2.5 py-1.5 rounded-xl border border-dashed border-white/20 text-slate-400 hover:text-white text-xs hover:border-white/40 transition-colors flex items-center gap-1"
                title="Add Section"
              >
                <IconPlus className="w-3.5 h-3.5" />
                <span className="hidden sm:inline">Section</span>
              </button>
            </div>

            <div className="flex items-center gap-2 flex-shrink-0">
              <button
                onClick={() => setAddPathModalOpen(true)}
                className="flex items-center gap-1 px-3 py-1.5 rounded-xl bg-white/5 border border-white/15 text-slate-300 hover:text-white text-xs font-medium hover:border-white/30 transition-all shadow"
                title="Link local path"
              >
                <IconExternalLink className="w-3.5 h-3.5 text-sky-400" />
                <span className="hidden sm:inline">Link Local Path</span>
              </button>
              <button
                onClick={() => fileInputRef.current?.click()}
                className="flex items-center gap-1 px-3.5 py-1.5 rounded-xl bg-sky-400 text-zinc-950 font-bold text-xs hover:bg-sky-300 transition-all shadow"
                title="Add local file"
              >
                <IconUpload className="w-3.5 h-3.5" />
                <span>Add PDF / PPT / File</span>
              </button>
            </div>
          </div>

          {/* Type Filters & Search */}
          <div className="flex flex-wrap items-center justify-between gap-2 border-b border-white/5 pb-2.5 mb-3 text-xs">
            <div className="inline-flex rounded-xl bg-white/5 p-0.5 border border-white/10">
              {[
                { id: 'all', label: 'All' },
                { id: 'pdf', label: 'PDFs' },
                { id: 'ppt', label: 'PPT Slides' },
                { id: 'image', label: 'Images' },
                { id: 'code', label: 'Scripts / Code' },
              ].map(t => (
                <button
                  key={t.id}
                  onClick={() => setTypeFilter(t.id)}
                  className={`px-3 py-1 rounded-lg capitalize transition-all ${
                    typeFilter === t.id ? 'bg-white/20 text-white font-medium' : 'text-slate-400 hover:text-slate-200'
                  }`}
                >
                  {t.label}
                </button>
              ))}
            </div>

            <input
              type="text"
              value={searchQuery}
              onChange={(e) => setSearchQuery(e.target.value)}
              placeholder={`Search in ${activeSection?.name}...`}
              className="bg-white/5 border border-white/10 rounded-xl px-3 py-1 text-xs text-white placeholder-slate-500 w-44 sm:w-56 focus:outline-none"
            />
          </div>

          {/* Files Grid */}
          <div className="flex-1 overflow-y-auto pr-1">
            {filtered.length === 0 ? (
              <div className="text-center py-16 border border-dashed border-white/10 rounded-2xl p-6 space-y-3">
                <div className="w-12 h-12 rounded-2xl bg-white/5 border border-white/10 flex items-center justify-center text-slate-500 mx-auto">
                  <IconFolderHub className="w-6 h-6" />
                </div>
                <h4 className="text-sm font-semibold text-white">No files in {activeSection?.name}</h4>
                <p className="text-xs text-slate-400 max-w-sm mx-auto">
                  Add local PDFs, PowerPoint presentations, or Python scripts to view them in-app or open in your device's default app.
                </p>
                <div className="flex justify-center gap-2 pt-2">
                  <button
                    onClick={() => fileInputRef.current?.click()}
                    className="px-3.5 py-1.5 rounded-xl bg-white text-zinc-950 font-bold text-xs hover:bg-slate-100"
                  >
                    Select Local File
                  </button>
                  <button
                    onClick={() => setAddPathModalOpen(true)}
                    className="px-3.5 py-1.5 rounded-xl bg-white/5 border border-white/15 text-slate-300 text-xs"
                  >
                    Link Path
                  </button>
                </div>
              </div>
            ) : (
              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
                {filtered.map(file => (
                  <div
                    key={file.id}
                    onClick={() => setPreviewItem(file)}
                    className={`group relative p-3.5 rounded-2xl ${theme.cardBg} border ${theme.cardBorder} hover:border-white/25 transition-all cursor-pointer backdrop-blur-md flex flex-col justify-between shadow-sm`}
                  >
                    <div>
                      <div className="flex items-center justify-between mb-2">
                        <span className={`text-[10px] font-mono uppercase px-2 py-0.5 rounded-md border flex items-center gap-1 ${
                          file.type === 'pdf' ? 'bg-rose-950/80 text-rose-300 border-rose-800/80' :
                          file.type === 'ppt' ? 'bg-amber-950/80 text-amber-300 border-amber-800/80' :
                          file.type === 'image' ? 'bg-purple-950/80 text-purple-300 border-purple-800/80' :
                          file.type === 'code' ? 'bg-sky-950/80 text-sky-300 border-sky-800/80' :
                          'bg-white/10 text-slate-300 border-white/10'
                        }`}>
                          {file.type === 'pdf' && 'PDF Document'}
                          {file.type === 'ppt' && 'PowerPoint Presentation'}
                          {file.type === 'image' && 'Image / PNG'}
                          {file.type === 'code' && 'Python / Code'}
                          {file.type === 'path' && 'Linked Path'}
                        </span>

                        <button
                          onClick={(e) => handleDelete(file.id, e)}
                          className="opacity-0 group-hover:opacity-100 hover:text-rose-400 p-1 text-slate-500 transition-opacity"
                          title="Delete"
                        >
                          <IconTrash className="w-3.5 h-3.5" />
                        </button>
                      </div>

                      <h4 className="text-xs font-semibold text-white tracking-tight truncate group-hover:text-sky-400 transition-colors">
                        {file.name}
                      </h4>

                      {file.localPath && (
                        <p className="text-[10px] font-mono text-slate-400 truncate mt-1">
                          {file.localPath}
                        </p>
                      )}
                    </div>

                    <div className="flex items-center justify-between border-t border-white/5 pt-2 mt-3 text-[10px] font-mono text-slate-400">
                      <span>{file.sizeStr || 'Local'}</span>
                      <div className="flex items-center gap-2">
                        <button
                          onClick={(e) => { e.stopPropagation(); handleOpenInDeviceDefault(file); }}
                          className="flex items-center gap-1 hover:text-white text-sky-400"
                          title="Open in Device Default Application"
                        >
                          <IconExternalLink className="w-3 h-3" />
                          <span>Device App</span>
                        </button>
                        <span className="text-white flex items-center gap-0.5">
                          View
                        </span>
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>

          {/* Add Path Modal */}
          {addPathModalOpen && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
              <div className="w-full max-w-md rounded-2xl bg-zinc-950 border border-white/15 p-5 space-y-4 shadow-2xl">
                <div className="flex items-center justify-between">
                  <h3 className="text-sm font-semibold text-white">Link Local PDF / PPT / File</h3>
                  <button onClick={() => setAddPathModalOpen(false)} className="text-xs text-slate-400 hover:text-white">Close</button>
                </div>
                <div className="space-y-2">
                  <input
                    type="text"
                    value={pathNameInput}
                    onChange={(e) => setPathNameInput(e.target.value)}
                    placeholder="Display Name (e.g. Machine Learning Slides)"
                    className="w-full bg-white/5 border border-white/10 rounded-xl px-3 py-2 text-xs text-white placeholder-slate-500 focus:outline-none"
                  />
                  <input
                    type="text"
                    value={pathInput}
                    onChange={(e) => setPathInput(e.target.value)}
                    placeholder="Full Path (e.g. C:\Docs\lecture.pptx or notes.pdf)"
                    className="w-full bg-white/5 border border-white/10 rounded-xl px-3 py-2 text-xs text-white font-mono placeholder-slate-500 focus:outline-none"
                  />
                </div>
                <div className="flex justify-end gap-2 pt-1">
                  <button onClick={() => setAddPathModalOpen(false)} className="px-3 py-1.5 rounded-xl border border-white/10 text-xs text-slate-400">Cancel</button>
                  <button onClick={handleAddPath} disabled={!pathInput.trim()} className="px-4 py-1.5 rounded-xl bg-sky-400 text-zinc-950 font-bold text-xs hover:bg-sky-300">Add to {activeSection?.name}</button>
                </div>
              </div>
            </div>
          )}

          {/* Full Screen In-App Viewer Modal */}
          {previewItem && (
            <div className="fixed inset-0 z-50 bg-black/90 backdrop-blur-2xl flex flex-col p-4 sm:p-6">
              <div className="flex items-center justify-between border-b border-white/10 pb-3 mb-4 max-w-5xl mx-auto w-full">
                <div className="flex items-center gap-2 truncate">
                  <span className="text-xs font-mono px-2 py-0.5 rounded bg-white/10 text-sky-400">
                    {previewItem.type.toUpperCase()}
                  </span>
                  <h3 className="text-sm font-semibold text-white truncate">{previewItem.name}</h3>
                </div>

                <div className="flex items-center gap-2 flex-shrink-0">
                  <button
                    onClick={() => handleOpenInDeviceDefault(previewItem)}
                    className="px-3 py-1.5 rounded-xl bg-sky-400 text-zinc-950 font-bold text-xs hover:bg-sky-300 flex items-center gap-1.5 shadow"
                    title="Open with device default app"
                  >
                    <IconExternalLink className="w-3.5 h-3.5" />
                    <span>Open in Device App</span>
                  </button>

                  <button
                    onClick={() => setPreviewItem(null)}
                    className="px-3 py-1.5 rounded-xl bg-white/10 text-white text-xs hover:bg-white/20"
                  >
                    Close
                  </button>
                </div>
              </div>

              <div className="flex-1 max-w-5xl mx-auto w-full overflow-hidden flex flex-col rounded-2xl bg-zinc-950 border border-white/10 p-3">
                {previewItem.type === 'pdf' && (
                  <div className="flex-1 flex flex-col h-full w-full">
                    {previewItem.dataUrl ? (
                      <embed
                        src={previewItem.dataUrl}
                        type="application/pdf"
                        className="w-full h-full rounded-xl border border-white/10"
                      />
                    ) : (
                      <div className="flex-1 flex flex-col items-center justify-center p-6 text-center space-y-3">
                        <IconExternalLink className="w-14 h-14 text-rose-400" />
                        <h4 className="text-base font-semibold text-white">{previewItem.name}</h4>
                        <p className="text-xs font-mono text-slate-400">{previewItem.localPath}</p>
                        <button
                          onClick={() => handleOpenInDeviceDefault(previewItem)}
                          className="px-4 py-2 rounded-xl bg-white text-zinc-950 font-bold text-xs"
                        >
                          Launch in Device PDF Viewer
                        </button>
                      </div>
                    )}
                  </div>
                )}

                {previewItem.type === 'ppt' && (
                  <div className="flex-1 flex flex-col items-center justify-center text-center p-6 space-y-4">
                    <div className="w-16 h-16 rounded-2xl bg-amber-950 border border-amber-500/40 flex items-center justify-center text-amber-400">
                      <IconExternalLink className="w-8 h-8" />
                    </div>
                    <div>
                      <h4 className="text-lg font-bold text-white">{previewItem.name}</h4>
                      <p className="text-xs text-slate-400 font-mono mt-1">
                        PowerPoint Presentation • {previewItem.sizeStr}
                      </p>
                    </div>
                    <button
                      onClick={() => handleOpenInDeviceDefault(previewItem)}
                      className="px-5 py-2.5 rounded-xl bg-amber-400 text-zinc-950 font-bold text-xs hover:bg-amber-300 flex items-center gap-2 shadow-lg"
                    >
                      <IconExternalLink className="w-4 h-4" />
                      <span>Open in PowerPoint / Device Viewer</span>
                    </button>
                  </div>
                )}

                {previewItem.type === 'code' && (
                  <pre className="flex-1 overflow-auto bg-black p-4 rounded-xl text-xs font-mono text-emerald-300 leading-relaxed border border-white/5 select-text">
                    {previewItem.content || `# Local Script Reference\nPath: ${previewItem.localPath}`}
                  </pre>
                )}

                {previewItem.type === 'image' && previewItem.dataUrl && (
                  <div className="flex-1 flex items-center justify-center overflow-auto">
                    <img src={previewItem.dataUrl} alt={previewItem.name} className="max-h-full max-w-full object-contain rounded-xl" />
                  </div>
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    // ==========================================
    // MODULE: CUSTOMIZABLE POMODORO
    // ==========================================
    function CustomizablePomodoro({ theme }) {
      const [workMinutes, setWorkMinutes] = useState(25);
      const [breakMinutes, setBreakMinutes] = useState(5);
      const [timeLeft, setTimeLeft] = useState(25 * 60);
      const [mode, setMode] = useState('work');
      const [isRunning, setIsRunning] = useState(false);

      const presets = [15, 20, 25, 30, 45, 60, 90];

      useEffect(() => {
        let timer = null;
        if (isRunning) {
          timer = setInterval(() => {
            setTimeLeft(prev => {
              if (prev <= 1) {
                clearInterval(timer);
                setIsRunning(false);
                playChimeSound();
                if (mode === 'work') {
                  setMode('break');
                  setTimeLeft(breakMinutes * 60);
                } else {
                  setMode('work');
                  setTimeLeft(workMinutes * 60);
                }
                return 0;
              }
              return prev - 1;
            });
          }, 1000);
        }
        return () => { if (timer) clearInterval(timer); };
      }, [isRunning, mode, workMinutes, breakMinutes]);

      const mins = Math.floor(timeLeft / 60);
      const secs = timeLeft % 60;
      const totalSec = mode === 'work' ? workMinutes * 60 : breakMinutes * 60;
      const progress = totalSec > 0 ? (totalSec - timeLeft) / totalSec : 0;

      return (
        <div className="space-y-6 max-w-lg mx-auto w-full pt-2 text-center">
          <div className="flex flex-wrap items-center justify-center gap-1.5 p-2 rounded-2xl bg-white/5 border border-white/10 backdrop-blur-xl">
            <span className="text-[11px] font-mono text-slate-400 mr-1">Choose Work Time:</span>
            {presets.map(m => (
              <button
                key={m}
                onClick={() => {
                  setWorkMinutes(m);
                  if (!isRunning && mode === 'work') setTimeLeft(m * 60);
                }}
                className={`px-2.5 py-1 text-xs font-mono rounded-lg transition-all ${
                  workMinutes === m
                    ? 'bg-white text-zinc-950 font-bold shadow'
                    : 'bg-white/5 text-slate-300 hover:bg-white/10'
                }`}
              >
                {m}m
              </button>
            ))}
          </div>

          <div className="relative flex flex-col items-center justify-center py-6">
            <div className="font-mono text-7xl font-light tracking-tight text-white select-none">
              {String(mins).padStart(2, '0')}:{String(secs).padStart(2, '0')}
            </div>
            <span className="text-[11px] font-mono uppercase tracking-widest text-slate-400 mt-3">
              {mode === 'work' ? `${workMinutes}m Deep Focus Block` : `${breakMinutes}m Rest Period`}
            </span>
            <div className="w-48 h-1.5 bg-white/10 rounded-full mt-4 overflow-hidden">
              <div
                className="h-full bg-sky-400 rounded-full transition-all duration-300"
                style={{ width: `${progress * 100}%` }}
              />
            </div>
          </div>

          <div className="flex items-center justify-center gap-4">
            <button
              onClick={() => {
                setIsRunning(false);
                setTimeLeft(mode === 'work' ? workMinutes * 60 : breakMinutes * 60);
              }}
              className="px-4 py-2 rounded-xl bg-white/5 border border-white/10 text-xs text-slate-300 hover:text-white"
            >
              Reset
            </button>
            <button
              onClick={() => setIsRunning(!isRunning)}
              className="px-9 py-3.5 rounded-full bg-white text-zinc-950 font-bold text-sm hover:bg-slate-100 shadow-xl active:scale-95 transition-all"
            >
              {isRunning ? 'Pause Session' : 'Start Flow'}
            </button>
          </div>
        </div>
      );
    }

    // ==========================================
    // MODULE: TASKS
    // ==========================================
    function TasksModule({ theme, tasks, setTasks, onStartFocus }) {
      const [title, setTitle] = useState('');
      const [category, setCategory] = useState('Python');
      const [filter, setFilter] = useState('all');

      const handleAdd = (e) => {
        e.preventDefault();
        if (!title.trim()) return;
        setTasks([{ id: 't-' + Date.now(), title: title.trim(), completed: false, priority: 'medium', category }, ...tasks]);
        setTitle('');
      };

      const filtered = tasks.filter(t => filter === 'all' ? true : filter === 'active' ? !t.completed : t.completed);

      return (
        <div className="space-y-4 max-w-2xl mx-auto w-full pt-1">
          <form onSubmit={handleAdd} className={`p-3.5 rounded-2xl ${theme.cardBg} border ${theme.cardBorder} space-y-3`}>
            <input
              type="text"
              value={title}
              onChange={(e) => setTitle(e.target.value)}
              placeholder="What singular task will you focus on next?"
              className="w-full bg-black/40 border border-white/10 rounded-xl px-3.5 py-2 text-sm text-white placeholder-slate-500 focus:outline-none"
            />
            <div className="flex items-center justify-between text-xs">
              <input
                type="text"
                value={category}
                onChange={(e) => setCategory(e.target.value)}
                placeholder="Category (e.g. Python)"
                className="w-28 bg-black/40 border border-white/10 rounded-lg px-2 py-1 text-[11px] text-slate-200"
              />
              <button
                type="submit"
                disabled={!title.trim()}
                className="px-3.5 py-1.5 rounded-xl bg-white text-zinc-950 font-bold text-xs hover:bg-slate-100 disabled:opacity-40"
              >
                Add Task
              </button>
            </div>
          </form>

          <div className="space-y-2">
            {filtered.map(task => (
              <div
                key={task.id}
                className={`flex items-center justify-between p-3 rounded-xl border ${task.completed ? 'bg-black/20 border-white/5 text-slate-600' : 'bg-white/5 border-white/10 text-slate-200'}`}
              >
                <div className="flex items-center gap-3 truncate">
                  <button
                    onClick={() => setTasks(tasks.map(t => t.id === task.id ? { ...t, completed: !t.completed } : t))}
                    className={`w-5 h-5 rounded-md flex items-center justify-center border ${task.completed ? 'bg-white/10 border-white/15 text-slate-400' : 'border-white/20 bg-black/40'}`}
                  >
                    {task.completed && <IconCheck className="w-3.5 h-3.5" />}
                  </button>
                  <span className={`text-xs truncate ${task.completed ? 'line-through text-slate-500' : 'text-white'}`}>{task.title}</span>
                  {task.category && <span className="text-[10px] font-mono text-slate-400">#{task.category}</span>}
                </div>
                <button onClick={() => setTasks(tasks.filter(t => t.id !== task.id))} className="p-1 text-slate-500 hover:text-rose-400"><IconTrash className="w-3.5 h-3.5" /></button>
              </div>
            ))}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
